#: Reload this file by pressing `ctrl+b :` and `source-file ~/.tmux.conf`.
##
set-option -g default-shell $SHELL

set-option -g history-limit 6000
#: Scrollback size; Be careful setting a very large default value, it can easily consume lots of RAM if you create many panes. (Default: 2000)
#: [[id:9e9f3596-87ad-42d7-b726-9b151a89a2a8][Do not use RAM for `history-limit` scrollback buffer · Issue #3714 · tmux/tmux]]
#: You can use =C-b := in an attached session to open tmux's command prompt. Then you can set the current session's limit interactively:
#: `set-option history-limit 30000`
#: Or to change the setting globally (should reset when tmux restarts):
#: `set-option -g history-limit 30000`

set-option -g display-time 6000

set-option -g remain-on-exit on

set -s escape-time 0

set -s focus-events on
#: @GPT6 lets applications inside tmux detect when they gain or lose focus, such as when you switch away from your terminal and return.

set -g mouse on
set -g status-keys vi
set -g mode-keys vi

bind-key r respawn-pane -k

## From https://unix.stackexchange.com/questions/348913/copy-selection-to-a-clipboard-in-tmux :
# 'copy-pipe-and-cancel' cancels the copy mode also
#
# For vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "brishz_in='MAGIC_READ_STDIN' brishzq.zsh pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "brishz_in='MAGIC_READ_STDIN' brishzq.zsh pbcopy"
# For emacs copy mode bindings
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "brishz_in='MAGIC_READ_STDIN' brishzq.zsh pbcopy"
##
#: --- truecolor spelling per client ---
#:
#: tmux re-emits the colors of a pane using the *attached client's* terminfo, so
#: a client that misreports its TERM gets sequences its emulator cannot parse.
#: kitty's terminfo spells 24-bit color with colons:
#:   setrgbf=\E[38:2:%p1%d:%p2%d:%p3%dm
#: Termux rejects that form and prints the tail as text (`2:0:255:0m ...`), so
#: anything colored looked broken there while being fine outside tmux. Force the
#: de-facto semicolon spelling for any client claiming xterm-kitty; real kitty
#: accepts both, and these options are matched by a TERM glob, so no other
#: client is affected. See =~/scripts/docs/tmux-termux-truecolor.md=.
set -sa terminal-overrides ',xterm-kitty:setrgbf=\E[38;2;%p1%d;%p2%d;%p3%dm:setrgbb=\E[48;2;%p1%d;%p2%d;%p3%dm'

#: Truecolor for honest xterm-256color clients, which is what Termux should
#: report. tmux's built-in RGB capability strings already use semicolons.
set -as terminal-features ',xterm-256color:RGB'

#: The two options above govern what tmux sends *outward*, to the client. This
#: one governs what it advertises *inward*, to the programs running in a pane:
#: tmux-direct is the ncurses direct-color variant of tmux-256color, with
#: colors#0x1000000, whose setaf/setab take a 24-bit RGB value rather than a
#: palette index. That is the honest way to give panes truecolor, instead of
#: overwriting TERM with the outer terminal's name the way .shared.sh used to.
#:
#: Trade-off, measured rather than assumed. Unchanged: `tput setaf 2` (\E[32m),
#: and any program writing \E[38;5;46m itself, which tmux passes through.
#: Changed: `tput setaf 46` now means RGB(0,0,46), not palette index 46. That
#: only bites a program calling terminfo setaf with an index of 8..255 without
#: first checking `colors`; tools that emit raw SGR are unaffected.
#:
#: Applies to new panes only, so existing ones keep tmux-256color until they
#: are recreated. Revert by deleting this line.
set -g default-terminal 'tmux-direct'
##
