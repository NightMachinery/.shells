<!doctype html>
<!-- Generated from the `transit` package. One row's journeys, in full, taking their
     whole state from the URL fragment so the page opens with no network at all. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Journey</title>
    <link rel="icon" type="image/png" sizes="72x72" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <!-- The version in the query is not a cache-busting habit, it is the fix for a
         real failure: a browser holds the page, the stylesheet and the script as
         separate cache entries, and anything that fills them one at a time can
         end up pairing a script from one build with a stylesheet from another.
         Two builds now cannot share a URL for these files, so one can never
         stand in for the other. The placeholder is stamped at publish time; see
         `page/sw.js` and the refresh script. -->
    <link rel="stylesheet" href="theme.css?v=__SHELL_HASH__" />
    <style>
      /* Only what this page has and the overlay does not. The journey view
         itself is drawn by a module both this page and the board's in-app
         overlay call, so its styles live in theme.css with everything else the
         two share. What is left here is the page frame. */

      .empty {
        color: var(--ink-soft);
        padding: 24px 0;
      }

      @media (max-width: 480px) {
        #app {
          padding: 0 12px 32px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Replaced when this shell is published; see src/page/build.ts. An
         unpublished shell keeps the placeholder and reports no build id. -->
    <script>window.__BUILD__ = "__BUILD_ID__";</script>
    <script src="route.js?v=__SHELL_HASH__"></script>
  </body>
</html>
