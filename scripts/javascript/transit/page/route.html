<!doctype html>
<!-- Generated from the `transit` package. One row's journeys, in full, taking their
     whole state from the URL fragment so the page opens with no network at all. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Journey</title>
    <link rel="icon" type="image/png" sizes="72x72" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* Only what this page has and the board does not. Everything else, the
         palette included, comes from theme.css, which both pages share. */

      .route-page-head {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: 0 -16px 14px;
        padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .route-page-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .route-page-time {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .route-page-delay {
        color: var(--late);
        font-weight: 700;
      }

      .route-page-where {
        margin: 4px 0 0;
        color: var(--ink-soft);
      }

      .route-page-platform {
        margin: 2px 0 0;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .route-page-cancelled {
        margin: 6px 0 0;
        color: var(--late);
        font-weight: 700;
      }

      .route-page-foot {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .route-replan {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
        background: var(--card);
      }

      .route-replan[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      .route-page-error {
        color: var(--late);
      }

      /* One journey, as a card. The recommended one is the only one with a
         coloured edge, because a page of equals answers no question. */
      .route-option {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        margin-bottom: 12px;
      }

      .route-option-best {
        border-left: 4px solid var(--accent);
      }

      .route-option-tight {
        border-style: dashed;
      }

      .route-option-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .route-option-title {
        margin: 0;
        font-size: 16px;
      }

      .route-option-mark {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
        font-weight: 700;
      }

      .route-arrival-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 10px 0 0;
      }

      .route-arrival-label {
        color: var(--ink-soft);
      }

      .route-arrival-time {
        font-size: 24px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        color: var(--ink-soft);
        padding: 24px 0;
      }

      @media (max-width: 480px) {
        #app {
          padding: 0 12px 32px;
        }

        .route-page-head {
          margin: 0 -12px 12px;
          padding-left: 12px;
          padding-right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="route.js"></script>
  </body>
</html>
