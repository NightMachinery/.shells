<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Departures</title>
    <!-- The page carries its own mark, because the html-reports build writes favicons for
         sections and this is a leaf it only symlinks to. Relative, so the same bytes work
         from a file:// copy, from the tailnet site and from the mirror. A tram car rather
         than a train: it has to survive 16 pixels in a tab, and the train emoji is pale
         and shrinks into a smudge where this one is a red box with a dark outline. See
         icons/LICENSE.md, which the refresh script does not copy and does not need to. -->
    <link rel="icon" type="image/png" sizes="72x72" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The tokens, the base type and everything a journey is drawn with live in
         one file, because the expanded journey page draws the same things and two
         copies of a palette drift. What is only ever on this page stays below. -->
    <!-- The version in the query is not a cache-busting habit, it is the fix for a
         real failure: a browser holds the page, the stylesheet and the script as
         separate cache entries, and anything that fills them one at a time can
         end up pairing a script from one build with a stylesheet from another.
         Two builds now cannot share a URL for these files, so one can never
         stand in for the other. The placeholder is stamped at publish time; see
         `page/sw.js` and the refresh script. -->
    <link rel="stylesheet" href="theme.css?v=__SHELL_HASH__" />
    <style>
      /* ------------------------------------------------------------- the bar */

      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 0 -16px 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px 6px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .bar-top {
        justify-content: space-between;
      }

      /* The horizon, the start time and the destination do not fit on a phone
         side by side, and a control that cannot be reached is worse than one
         that has to be scrolled to. Same treatment as the chips: scrollable,
         with the scrollbar hidden so it still reads as a bar. */
      .bar-controls {
        overflow-x: auto;
        scrollbar-width: none;
      }

      .bar-controls::-webkit-scrollbar {
        display: none;
      }

      /* With the scrollbar gone nothing says a control is hiding past the edge,
         so the overflowing side fades out. The classes are set from the strip's
         own scroll position, and the fade comes off at the end it has reached:
         a last control that stays dimmed reads as disabled, not as reachable. */
      .bar-controls.fade-end {
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
        mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
      }

      .bar-controls.fade-start {
        -webkit-mask-image: linear-gradient(to right, transparent, #000 24px);
        mask-image: linear-gradient(to right, transparent, #000 24px);
      }

      .bar-controls.fade-start.fade-end {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent,
          #000 24px,
          #000 calc(100% - 24px),
          transparent
        );
        mask-image: linear-gradient(
          to right,
          transparent,
          #000 24px,
          #000 calc(100% - 24px),
          transparent
        );
      }

      .bar-controls > * {
        flex: none;
      }

      .bar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }

      .tabs {
        display: flex;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab {
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 13px;
        white-space: nowrap;
        color: var(--ink-soft);
      }

      .tab.active {
        background: var(--ink);
        color: var(--bg);
        font-weight: 600;
      }

      .refresh {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
      }

      .refresh-ring {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        display: inline-block;
      }

      .refresh-ring.spinning {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .refresh-ring.spinning {
          animation-duration: 3s;
        }
      }

      .refresh-age {
        font-size: 12px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        min-width: 3.6em;
        text-align: right;
      }

      .chips {
        display: flex;
        gap: 6px;
        margin-top: 5px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .chips::-webkit-scrollbar {
        display: none;
      }

      .chip {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        white-space: nowrap;
        font-size: 12px;
        max-width: 13rem;
      }

      .chip-title {
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink-soft);
      }

      .chip-next {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .bar-controls {
        margin-top: 5px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .bar-controls::-webkit-scrollbar {
        display: none;
      }

      .horizon,
      .start {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .segmented {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }

      .segment {
        padding: 3px 8px;
        font-size: 12px;
        color: var(--ink-soft);
        border-right: 1px solid var(--line);
      }

      .segment:last-child {
        border-right: none;
      }

      .segment.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .horizon-end,
      .bar-backend,
      .start-note {
        font-size: 12px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      .start-now,
      .start-nudge {
        padding: 3px 7px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink-soft);
      }

      .start-now.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      .start-input {
        font: inherit;
        font-size: 12px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink);
      }

      .start.picked .start-note {
        color: var(--warn);
        font-weight: 600;
      }

      /* The picker in the sticky bar. Named apart from the row cell it used to
         collide with: both were `.destination`, so the bar's `display: flex`
         reached every row and quietly disabled the ellipsis there, which is why
         a squeezed destination was cut mid-letter instead of trailing off. */
      .destination-pick {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .destination-label {
        font-size: 12px;
        color: var(--ink-soft);
      }

      .destination-select {
        font: inherit;
        font-size: 12px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink);
      }

      .sort-arrival {
        padding: 3px 7px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink-soft);
      }

      .sort-arrival.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      /* The commute slot. A tight option is one that only works if the first leg
         runs early, so it is dashed as well as dimmed: the distinction has to
         survive a monochrome screen, and it is the distinction that decides
         whether someone runs for a train. */
      .route {
        display: flex;
        text-decoration: none;
        align-items: baseline;
        gap: 4px;
        min-width: 0;
        font-size: 11px;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      /* The name gives way; the onward line and the time do not. Where to get
         off is useful, what to catch and when you arrive are what the reader is
         comparing rows by. */
      .route-head {
        display: flex;
        align-items: baseline;
        gap: 3px;
        min-width: 0;
        overflow: hidden;
      }

      .route-exit {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .route-line {
        flex: none;
      }

      .route-arrival {
        flex: none;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--ink);
      }

      .route.tight {
        opacity: 0.7;
        border: 1px dashed currentColor;
        border-radius: 4px;
        padding: 0 3px;
      }

      .route.better {
        color: var(--accent);
        font-weight: 600;
      }

      /* A journey restored from the last visit. Dimmed and italic, because an
         arrival time is the one number here that looks exactly as convincing
         when it is an hour old as when it is a second old. */
      .route-planning {
        display: flex;
        align-items: center;
      }

      .route-stale {
        opacity: 0.55;
        font-style: italic;
      }

      .board-planning,
      .board-stale {
        color: var(--ink-soft);
        font-style: italic;
      }

      .bar-error {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--late);
      }

      /* ---------------------------------------------------------- the boards */

      .board {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 7px 12px 9px;
        margin-bottom: var(--gap);
      }

      /* Title, standing facts and controls on one line. The note in the middle
         is the part that yields: it is the only thing here that can be read
         once and forgotten, so it shrinks and then ellipsises while the title
         and the gear stay whole. */
      .board-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .board-title {
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        flex: none;
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The note takes whatever the line has spare, which is what keeps the
         gear against the card's right edge without a `justify-content` that
         would also push the note away from the title it belongs to. */
      .board-note {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .board-destination,
      .board-note .board-walk {
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
        font-size: inherit;
        color: inherit;
      }

      /* The destination is the half worth keeping when only half fits: the walk
         is three characters of a number the reader already knows, and where the
         board goes is what tells two boards apart. */
      .board-note .board-walk {
        flex: 0 1 auto;
      }

      .board-destination {
        flex: 0 2 auto;
      }

      .board-marks {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }

      .backend,
      .filter-mark {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .filter-button {
        font-size: 13px;
        color: var(--ink-soft);
        padding: 2px 4px;
      }

      .board-progress {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .board-error {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--late);
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .retry {
        border: 1px solid currentColor;
        border-radius: 7px;
        padding: 2px 8px;
        font-size: 12px;
      }

      .rows,
      .strips {
        list-style: none;
        margin: 5px 0 0;
        padding: 0;
      }

      /* Every row of a board carries the same column template, set from script
         because which optional slots exist is a property of the board rather
         than of the stylesheet. Same template on every row means the slots line
         up down the board without a subgrid, which is not everywhere yet. */
      .row {
        display: grid;
        align-items: baseline;
        /* The row is one tap target, so it carries a floor rather than only
           padding: a finger aims at a band, and a band under about forty
           pixels is one the reader hits the neighbouring departure on. The
           padding is what a row gets when its content is already taller, the
           floor is what it gets when it is not, and `align-content` is what
           puts the content in the middle of the difference. */
        align-content: center;
        min-height: 40px;
        column-gap: 7px;
        padding: 3px 0;
        border-top: 1px solid var(--line);
        /* So the live/planned disc can be placed in the row's corner. It is the
           only thing on the page positioned out of its own flow, and it is
           there because a mark that takes a grid track takes it from the
           destination in every font on every device. */
        position: relative;
      }

      .row:first-child {
        border-top: none;
      }

      .row.unreachable {
        opacity: 0.45;
      }

      .row.first-catchable {
        box-shadow: inset 3px 0 0 -1px var(--accent);
      }

      .minutes {
        font-size: 19px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .row-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .destination {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }

      /* The hint beside a regional service's times: where the run goes after
         here. Quiet, because it is context for the destination rather than a
         fact the reader came for, and truncated rather than wrapped, because a
         row that grows a line is a row fewer on the screen. */
      .row-via {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .row-times,
      .times {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
      }

      /* Delay and cancellation are carried by weight and by a struck line as
         well as by colour, so they survive a monochrome screen and a reader who
         does not separate red from green. */
      .time-main.late {
        color: var(--late);
        font-weight: 700;
      }

      .time-main.early {
        color: var(--early);
        font-weight: 700;
      }

      .time-planned {
        color: var(--ink-soft);
        font-style: italic;
        opacity: 0.85;
      }

      .times.cancelled .time-main,
      .time.cancelled,
      .row-cancelled .destination {
        text-decoration: line-through;
        color: var(--ink-soft);
        font-weight: 400;
      }

      .flag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 4px;
        border-radius: 4px;
        border: 1px solid currentColor;
      }

      .flag.sev {
        color: var(--warn);
      }

      .flag.cancelled-flag {
        color: var(--late);
      }

      .connection {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* The platform and the live state, as one mark in the row's corner.
         Both used to be grid tracks. The platform's two characters cost the
         destination a quarter of its width, and the live mark overflowed on the
         reader's phone in every form it took, because a track is a promise about
         width and the font that has to keep it is not the font here.

         Out of the flow, so it costs the row nothing. Flush into the corner, so
         it reads as part of the row's edge rather than as something floating on
         top of it: no margin, and the two corners that lie along the row's own
         edges stay square so the badge fuses with them. Only the corner that
         faces into the row is rounded. */
      .platform {
        position: absolute;
        top: 0;
        right: 0;
        /* Taller than it was, and no taller. A row is forty pixels now so a
           finger can hit it, and the fifteen-pixel mark that suited a
           twenty-nine pixel row looked stuck on top of this one. Running it the
           row's full height was tried and is worse: it turns the right edge of
           the board into a column of solid colour that outshouts the line
           badges, and a mark that tall stops reading as a property of the row
           and starts reading as a property of the card.

           Centred by line-height rather than by flex alignment, because a flex
           box on a row whose items are baseline-aligned inherits a baseline it
           should not have, and the digit then sits a pixel low in some fonts
           and not in others. A line-height equal to the height cannot drift. */
        min-width: 19px;
        height: 18px;
        line-height: 18px;
        box-sizing: border-box;
        padding: 0 3px;
        overflow: hidden;
        font-size: 11px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        border-radius: 0 0 0 7px;
        color: #fff;
      }

      /* A row with no platform still gets the badge, so the colour still says
         whether the time is live and the corner still looks like one thing. It
         is a square rather than a slot with nothing in it. */
      .platform-empty {
        min-width: 18px;
        padding: 0;
      }

      .state-live {
        background: var(--early);
      }

      .state-plan {
        background: var(--ink-soft);
      }

      /* Cancelled outranks both. A departure that is not running is not usefully
         described as live, and the struck text says so a second way for a reader
         who does not separate red from green. */
      .state-cancelled {
        background: var(--late);
        text-decoration: line-through;
      }

      /* Clipped, every one of them. A grid track is a promise about width, and
         a cell whose text is wider than its track breaks that promise by
         painting over its neighbours rather than by overflowing anything the
         browser will report. What is too wide depends on the reader's font,
         which is not this machine's font, so the only safe rule is that none of
         these may draw outside the box they were given. */
      .badge,
      .minutes {
        overflow: hidden;
      }

      /* A cancelled row is already struck through and dimmed; the badge follows
         it down rather than staying bright on a departure that is not running. */
      .row-cancelled .platform {
        opacity: 0.55;
      }

      .stop-tag {
        font-size: 11px;
        color: var(--ink-soft);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .slot-empty {
        display: block;
      }

      /* The one thing on this page that interrupts. Fixed to the bottom so it
         never covers a departure time, wide enough to tap without aiming. */
      /* Every icon on the page. Sized in em so it matches whatever text it sits
         beside, and painted with the inherited colour so it needs none of its
         own. These replaced characters, which depend on the reader's system
         font having the picture, which Android's does not for the walk symbol. */
      .icon {
        width: 1em;
        height: 1em;
        display: inline-block;
        vertical-align: -0.125em;
        flex: none;
        color: currentColor;
      }

      .leg-walk-badge .icon {
        width: 1.15em;
        height: 1.15em;
      }

      .update-toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--ink);
        color: var(--card);
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }

      .filter-timing {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      .filter-timing-board {
        padding-left: 8px;
        opacity: 0.8;
      }

      .filter-build {
        margin: 8px 0 0;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .row-skeleton {
        height: 34px;
        background: linear-gradient(90deg, var(--raised), var(--card), var(--raised));
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
        border-radius: 6px;
        margin: 4px 0;
        display: block;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      .skeleton {
        display: block;
      }

      /* ------------------------------------------------------- the strip view */

      .strip {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .strip:first-child {
        border-top: none;
      }

      .strip .direction {
        font-size: 12px;
        color: var(--ink-soft);
        max-width: 11rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The times run on from the line and its destination rather than
         underneath them. A group with one departure in it was two full lines
         for one time, which is worse than the rows view it exists to compress;
         flowing means a strip is one line until it genuinely needs two, and the
         wrap still happens at the same place when it does. */
      .times-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 7px;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .time.late {
        color: var(--late);
        font-weight: 700;
      }

      .time.early {
        color: var(--early);
        font-weight: 700;
      }

      .time-note {
        font-size: 9px;
        color: var(--ink-soft);
        margin-left: 2px;
        vertical-align: super;
      }

      /* The strip's own row, so the legend can sit under it without disturbing
         the rhythm of the times. */
      .strip-main {
        display: flex;
        align-items: baseline;
        gap: 7px;
        flex-wrap: wrap;
        flex: 1 1 100%;
        min-width: 0;
      }

      .strip-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        flex: 1 1 100%;
        font-size: 10px;
        color: var(--ink-soft);
      }

      .strip-legend-entry {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }

      /* A destination badge. Same height as the day marker, so a strip with
         branching services is still one line tall. */
      .dest-badge {
        display: inline-block;
        margin-left: 3px;
        padding: 0 3px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: 0.02em;
        vertical-align: super;
        background: hsl(var(--dest-hue, 0) var(--dest-badge-s) var(--dest-badge-l));
        color: var(--dest-badge-ink);
      }

      .strip-legend .dest-badge {
        vertical-align: baseline;
        margin-left: 0;
      }

      .board-collapsed .board-walk {
        font-style: italic;
      }

      .empty,
      .filter-empty {
        color: var(--ink-soft);
        font-size: 13px;
        margin: 8px 0 0;
      }

      /* --------------------------------------------------------- the filters */

      .filter-popover {
        margin: 8px 0 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: center;
      }

      .filter-stop {
        margin: 0;
        width: 100%;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
      }

      .filter-line {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
      }

      .filter-buffer {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--ink-soft);
      }

      .filter-buffer input {
        width: 3.5em;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
      }

      .filter-buffer-unit {
        margin-left: -2px;
      }

      /* ----------------------------------------------------- the disruptions */

      .disruptions {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 8px 12px;
        margin-bottom: var(--gap);
        font-size: 13px;
      }

      .disruptions summary {
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .disruption {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 8px;
      }

      .disruption p {
        margin: 4px 0 0;
      }

      .disruption-lines {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .disruptions-summary {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .disruptions-count {
        font-weight: 600;
      }

      .disruptions-hidden,
      .disruptions-note,
      .disruption-when,
      .disruption-provider,
      .translate-settings-note,
      .translate-settings-status {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .disruptions-note {
        margin: 8px 0 0;
      }

      .disruptions-restore {
        font-size: 11px;
        color: var(--accent);
        text-decoration: underline;
      }

      .disruptions-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 8px 0 0;
      }

      .disruptions-chip {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--card);
      }

      .disruptions-chip.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      .disruptions-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0 0;
      }

      .disruptions-copy,
      .disruptions-translate,
      .disruption-ack,
      .translate-save,
      .translate-forget,
      .translate-close {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--card);
        white-space: nowrap;
      }

      .disruptions-copy:disabled,
      .disruptions-translate:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .disruptions-settings {
        font-size: 13px;
        color: var(--ink-soft);
        padding: 2px 4px;
      }

      .disruption-title {
        font-weight: 600;
      }

      .disruption-ack {
        margin-top: 6px;
      }

      /* An acknowledged notice shown on purpose still has to read as dismissed,
         or the reader cannot tell why it is back. */
      .disruption-acknowledged {
        opacity: 0.55;
      }

      .disruption-acknowledged .disruption-title {
        text-decoration: line-through;
      }

      .disruption-translation {
        margin: 6px 0 0;
        padding-left: 8px;
        border-left: 2px solid var(--accent);
      }

      /* Appended to the body rather than to the panel, so a repaint cannot
         destroy a half-typed key. That means the stylesheet owns its placement
         entirely; the script sets no geometry. */
      .translate-settings {
        position: fixed;
        z-index: 50;
        left: 50%;
        top: 20%;
        transform: translateX(-50%);
        width: min(22rem, calc(100vw - 24px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgb(0 0 0 / 22%);
        padding: 14px;
        font-size: 13px;
      }

      .translate-settings-title {
        margin: 0;
        font-weight: 600;
      }

      .translate-settings-note,
      .translate-settings-status {
        margin: 6px 0 0;
      }

      .translate-key {
        font: inherit;
        font-size: 13px;
        width: 100%;
        margin: 10px 0 0;
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
      }

      .translate-settings-actions {
        display: flex;
        gap: 8px;
        margin: 12px 0 0;
      }

      .translate-forget[hidden] {
        display: none;
      }

      /* ----------------------------------------------------------- the alarms */

      .alarm-marker {
        font-size: 11px;
        color: var(--warn);
        text-align: center;
      }

      .alarm-popup {
        position: fixed;
        z-index: 40;
        width: min(21rem, calc(100vw - 24px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgb(0 0 0 / 22%);
        padding: 12px 14px;
        font-size: 13px;
      }

      .alarm-popup-title {
        font-weight: 600;
        margin: 0;
      }

      .alarm-popup-when,
      .alarm-note,
      .alarm-status,
      .alarm-denied {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .alarm-denied {
        color: var(--late);
      }

      .alarm-walk {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 0;
        flex-wrap: wrap;
      }

      .alarm-walk-input {
        font: inherit;
        font-size: 13px;
        width: 4rem;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
      }

      .alarm-walk-unit,
      .alarm-walk-label {
        font-size: 12px;
        color: var(--ink-soft);
      }

      .alarm-leads {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0 0;
      }

      .alarm-lead-box {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .alarm-lead-text {
        font-size: 12px;
      }

      .alarm-actions {
        display: flex;
        gap: 8px;
        margin: 12px 0 0;
      }

      .alarm-set,
      .alarm-drop,
      .alarm-close {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 10px;
        font-size: 13px;
      }

      .alarm-set {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ------------------------------------------------------------ narrower */

      .disruption-original {
        margin-left: 6px;
        font-size: 11px;
      }

      @media (max-width: 480px) {
        :root {
          /* Lower than the desktop floor on purpose: on a phone the journey
             slot is the one that must not collapse, so the destination is
             what yields. It is abbreviated already and repeated down the
             group, so a few characters cost the reader nothing.

             These numbers have to add up to less than a row is wide, and a row
             is narrower than the viewport by more than it looks: the card's
             border and the card's padding come off first. Getting that wrong
             does not wrap or ellipsise anything, it runs the last column off
             the side of the card where nothing shows it. */
          --col-destination-min: 3.4rem;
          /* No ceiling on a phone: there is no space spare for the journey to
             take, so every pixel the fixed slots do not need belongs to the
             destination. */
          --col-destination-max: 1fr;
          /* Wide enough for the widest the countdown can be, which is an hour
             count, a colon and two minutes at the far end of the longest
             horizon. Sized for a font wider than this one, because the one that
             renders it is not this one, and confirmed by the harness rather than
             estimated here. */
          --col-minutes: 3.85rem;
          --col-badge: 2.5rem;
          --col-connection: 4rem;
          --col-alarm: 0.9rem;
          --col-stop: 1.8rem;
          /* Pinned to its own floor here rather than given a range. A track
             with room to grow takes the leftover before the destination does,
             and the journey slot is already wide enough on a phone: every pixel
             above the floor would come straight out of the destination. */
          --col-route: 8rem;
          --col-route-min: 8rem;
          --gap: 8px;
        }

        /* No gutter and no side borders: the cards run to both edges of the
           screen. The gutter, the two borders and the card's own inset were
           twenty-four pixels of a three-hundred-and-ninety pixel screen, spent
           on white space either side of a list that is already separated from
           the screen by the screen's own edge. Every one of them goes into the
           destination, which is the column that yields first and the one a row
           is least useful without. The cards still read as cards: the page
           colour shows between them, and the rounded corners that are visible
           on a phone are the ones on the top and bottom edges. */
        #app {
          padding: 0 0 20px;
        }

        .board {
          border-left: none;
          border-right: none;
          border-radius: 0;
          padding: 5px 8px 7px;
        }

        /* A denser row on a phone. A pixel a column is not something a reader
           sees, and six of them are the difference between a destination that
           names a station and one that ellipsises it away. */
        .row {
          column-gap: 4px;
          padding: 2px 0;
        }

        .bar {
          margin: 0 0 8px;
          padding-left: 12px;
          padding-right: 12px;
        }

        /* The largest thing on the row, because it is the only number the
           reader came for: everything else on a row answers "which departure",
           and this answers "do I leave now". The extra two points cost the
           countdown's column a little more width, which comes out of the
           destination, which has enough of it since the cards went full
           bleed. */
        .minutes {
          font-size: 18px;
        }

        /* The two lines of a row sit directly on top of one another here. The
           gap was there to separate them and the difference in size and colour
           already does that. */
        .row-main {
          gap: 0;
        }

        .destination {
          font-size: 13px;
        }

        /* Times in a strip are tap targets too, and the only ones that view
           has: the group header opens nothing. So each one carries the same
           forty-pixel floor a row does, which also gives a wrapped strip the
           same rhythm as the rows above it. A block rather than a padded inline,
           because padding on an inline box grows the hit area without moving
           the line it sits on, and two targets that overlap are worse than one
           that is small. */
        .times-strip .time {
          display: block;
          min-height: 40px;
          line-height: 40px;
        }

        .strip {
          padding: 2px 0;
        }

        /* Centred rather than sat on a shared baseline. The times are
           forty-pixel bands here and the line badge beside them is not, and a
           baseline they share puts the badge at the top of the band with the
           time floating in the middle of it. */
        .strip-main {
          align-items: center;
        }
      }

    </style>
  </head>
