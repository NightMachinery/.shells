<!doctype html>
<!-- Generated from the `transit` package; the page repository's refresh script copies this shell, `app.js`, the icons, the manifest and the service worker in alongside its own `data/config.json`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Departures</title>
    <!-- The page carries its own mark, because the html-reports build writes favicons for
         sections and this is a leaf it only symlinks to. Relative, so the same bytes work
         from a file:// copy, from the tailnet site and from the mirror. A tram car rather
         than a train: it has to survive 16 pixels in a tab, and the train emoji is pale
         and shrinks into a smudge where this one is a red box with a dark outline. See
         icons/LICENSE.md, which the refresh script does not copy and does not need to. -->
    <link rel="icon" type="image/png" sizes="72x72" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The tokens, the base type and everything a journey is drawn with live in
         one file, because the expanded journey page draws the same things and two
         copies of a palette drift. What is only ever on this page stays below. -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* ------------------------------------------------------------- the bar */

      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 0 -16px 12px;
        padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .bar-top {
        justify-content: space-between;
      }

      /* The horizon, the start time and the destination do not fit on a phone
         side by side, and a control that cannot be reached is worse than one
         that has to be scrolled to. Same treatment as the chips: scrollable,
         with the scrollbar hidden so it still reads as a bar. */
      .bar-controls {
        overflow-x: auto;
        scrollbar-width: none;
      }

      .bar-controls::-webkit-scrollbar {
        display: none;
      }

      .bar-controls > * {
        flex: none;
      }

      .bar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }

      .tabs {
        display: flex;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab {
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 13px;
        white-space: nowrap;
        color: var(--ink-soft);
      }

      .tab.active {
        background: var(--ink);
        color: var(--bg);
        font-weight: 600;
      }

      .refresh {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
      }

      .refresh-ring {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        display: inline-block;
      }

      .refresh-ring.spinning {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .refresh-ring.spinning {
          animation-duration: 3s;
        }
      }

      .refresh-age {
        font-size: 12px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        min-width: 3.6em;
        text-align: right;
      }

      .chips {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .chips::-webkit-scrollbar {
        display: none;
      }

      .chip {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        white-space: nowrap;
        font-size: 12px;
        max-width: 13rem;
      }

      .chip-title {
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink-soft);
      }

      .chip-next {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .bar-controls {
        margin-top: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .bar-controls::-webkit-scrollbar {
        display: none;
      }

      .horizon,
      .start {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .segmented {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }

      .segment {
        padding: 3px 8px;
        font-size: 12px;
        color: var(--ink-soft);
        border-right: 1px solid var(--line);
      }

      .segment:last-child {
        border-right: none;
      }

      .segment.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      .horizon-end,
      .bar-backend,
      .start-note {
        font-size: 12px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      .start-now,
      .start-nudge {
        padding: 3px 7px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink-soft);
      }

      .start-now.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      .start-input {
        font: inherit;
        font-size: 12px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink);
      }

      .start.picked .start-note {
        color: var(--warn);
        font-weight: 600;
      }

      .destination {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .destination-label {
        font-size: 12px;
        color: var(--ink-soft);
      }

      .destination-select {
        font: inherit;
        font-size: 12px;
        padding: 2px 5px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink);
      }

      .sort-arrival {
        padding: 3px 7px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        color: var(--ink-soft);
      }

      .sort-arrival.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      /* The commute slot. A tight option is one that only works if the first leg
         runs early, so it is dashed as well as dimmed: the distinction has to
         survive a monochrome screen, and it is the distinction that decides
         whether someone runs for a train. */
      .route {
        display: flex;
        text-decoration: none;
        align-items: baseline;
        gap: 4px;
        min-width: 0;
        font-size: 11px;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      /* The name gives way; the onward line and the time do not. Where to get
         off is useful, what to catch and when you arrive are what the reader is
         comparing rows by. */
      .route-head {
        display: flex;
        align-items: baseline;
        gap: 3px;
        min-width: 0;
        overflow: hidden;
      }

      .route-exit {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .route-line {
        flex: none;
      }

      .route-arrival {
        flex: none;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--ink);
      }

      .route.tight {
        opacity: 0.7;
        border: 1px dashed currentColor;
        border-radius: 4px;
        padding: 0 3px;
      }

      .route.better {
        color: var(--accent);
        font-weight: 600;
      }

      /* A journey restored from the last visit. Dimmed and italic, because an
         arrival time is the one number here that looks exactly as convincing
         when it is an hour old as when it is a second old. */
      .route-stale {
        opacity: 0.55;
        font-style: italic;
      }

      .board-planning,
      .board-stale {
        color: var(--ink-soft);
        font-style: italic;
      }

      .bar-error {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--late);
      }

      /* ---------------------------------------------------------- the boards */

      .board {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px 12px;
        margin-bottom: var(--gap);
      }

      .board-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .board-title {
        font-size: 16px;
        font-weight: 600;
        text-align: left;
        min-width: 0;
      }

      .board-marks {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }

      .backend,
      .filter-mark {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .filter-button {
        font-size: 13px;
        color: var(--ink-soft);
        padding: 2px 4px;
      }

      .board-walk,
      .board-progress {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .board-error {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--late);
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .retry {
        border: 1px solid currentColor;
        border-radius: 7px;
        padding: 2px 8px;
        font-size: 12px;
      }

      .rows,
      .strips {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }

      /* Every row of a board carries the same column template, set from script
         because which optional slots exist is a property of the board rather
         than of the stylesheet. Same template on every row means the slots line
         up down the board without a subgrid, which is not everywhere yet. */
      .row {
        display: grid;
        align-items: baseline;
        column-gap: 7px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }

      .row:first-child {
        border-top: none;
      }

      .row.unreachable {
        opacity: 0.45;
      }

      .row.first-catchable {
        box-shadow: inset 3px 0 0 -1px var(--accent);
      }

      .minutes {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .row-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .destination {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }

      .row-times,
      .times {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
      }

      /* Delay and cancellation are carried by weight and by a struck line as
         well as by colour, so they survive a monochrome screen and a reader who
         does not separate red from green. */
      .time-main.late {
        color: var(--late);
        font-weight: 700;
      }

      .time-main.early {
        color: var(--early);
        font-weight: 700;
      }

      .time-planned {
        color: var(--ink-soft);
        font-style: italic;
        opacity: 0.85;
      }

      .times.cancelled .time-main,
      .time.cancelled,
      .row-cancelled .destination {
        text-decoration: line-through;
        color: var(--ink-soft);
        font-weight: 400;
      }

      .flag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 4px;
        border-radius: 4px;
        border: 1px solid currentColor;
      }

      .flag.sev {
        color: var(--warn);
      }

      .flag.cancelled-flag {
        color: var(--late);
      }

      .connection {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .platform {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink-soft);
      }

      .state {
        font-size: 10px;
        text-align: center;
        letter-spacing: 0.03em;
        border-radius: 4px;
        padding: 0 3px;
      }

      .state-live {
        color: var(--early);
        border: 1px solid currentColor;
        font-weight: 700;
      }

      .state-plan {
        color: var(--ink-soft);
        border: 1px dashed currentColor;
      }

      .stop-tag {
        font-size: 11px;
        color: var(--ink-soft);
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .slot-empty {
        display: block;
      }

      .row-skeleton {
        height: 34px;
        background: linear-gradient(90deg, var(--raised), var(--card), var(--raised));
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
        border-radius: 6px;
        margin: 4px 0;
        display: block;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      .skeleton {
        display: block;
      }

      /* ------------------------------------------------------- the strip view */

      .strip {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .strip:first-child {
        border-top: none;
      }

      .strip .direction {
        font-size: 12px;
        color: var(--ink-soft);
        max-width: 11rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .times-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        flex: 1 1 100%;
      }

      .time.late {
        color: var(--late);
        font-weight: 700;
      }

      .time.early {
        color: var(--early);
        font-weight: 700;
      }

      .time-note {
        font-size: 9px;
        color: var(--ink-soft);
        margin-left: 2px;
        vertical-align: super;
      }

      /* The strip's own row, so the legend can sit under it without disturbing
         the rhythm of the times. */
      .strip-main {
        display: flex;
        align-items: baseline;
        gap: 7px;
        flex-wrap: wrap;
        flex: 1 1 100%;
        min-width: 0;
      }

      .strip-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        flex: 1 1 100%;
        font-size: 10px;
        color: var(--ink-soft);
      }

      .strip-legend-entry {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }

      /* A destination badge. Same height as the day marker, so a strip with
         branching services is still one line tall. */
      .dest-badge {
        display: inline-block;
        margin-left: 3px;
        padding: 0 3px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: 0.02em;
        vertical-align: super;
        background: hsl(var(--dest-hue, 0) var(--dest-badge-s) var(--dest-badge-l));
        color: var(--dest-badge-ink);
      }

      .strip-legend .dest-badge {
        vertical-align: baseline;
        margin-left: 0;
      }

      .board-collapsed .board-walk {
        font-style: italic;
      }

      .empty,
      .filter-empty {
        color: var(--ink-soft);
        font-size: 13px;
        margin: 8px 0 0;
      }

      /* --------------------------------------------------------- the filters */

      .filter-popover {
        margin: 8px 0 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        align-items: center;
      }

      .filter-stop {
        margin: 0;
        width: 100%;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
      }

      .filter-line {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
      }

      .filter-buffer {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--ink-soft);
      }

      .filter-buffer input {
        width: 3.5em;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
      }

      .filter-buffer-unit {
        margin-left: -2px;
      }

      /* ----------------------------------------------------- the disruptions */

      .disruptions {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 8px 12px;
        margin-bottom: var(--gap);
        font-size: 13px;
      }

      .disruptions summary {
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .disruption {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 8px;
      }

      .disruption p {
        margin: 4px 0 0;
      }

      .disruption-lines {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .disruptions-summary {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .disruptions-count {
        font-weight: 600;
      }

      .disruptions-hidden,
      .disruptions-note,
      .disruption-when,
      .disruption-provider,
      .translate-settings-note,
      .translate-settings-status {
        font-size: 11px;
        color: var(--ink-soft);
      }

      .disruptions-note {
        margin: 8px 0 0;
      }

      .disruptions-restore {
        font-size: 11px;
        color: var(--accent);
        text-decoration: underline;
      }

      .disruptions-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 8px 0 0;
      }

      .disruptions-chip {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--card);
      }

      .disruptions-chip.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 600;
      }

      .disruptions-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0 0;
      }

      .disruptions-copy,
      .disruptions-translate,
      .disruption-ack,
      .translate-save,
      .translate-forget,
      .translate-close {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--card);
        white-space: nowrap;
      }

      .disruptions-copy:disabled,
      .disruptions-translate:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .disruptions-settings {
        font-size: 13px;
        color: var(--ink-soft);
        padding: 2px 4px;
      }

      .disruption-title {
        font-weight: 600;
      }

      .disruption-ack {
        margin-top: 6px;
      }

      /* An acknowledged notice shown on purpose still has to read as dismissed,
         or the reader cannot tell why it is back. */
      .disruption-acknowledged {
        opacity: 0.55;
      }

      .disruption-acknowledged .disruption-title {
        text-decoration: line-through;
      }

      .disruption-translation {
        margin: 6px 0 0;
        padding-left: 8px;
        border-left: 2px solid var(--accent);
      }

      /* Appended to the body rather than to the panel, so a repaint cannot
         destroy a half-typed key. That means the stylesheet owns its placement
         entirely; the script sets no geometry. */
      .translate-settings {
        position: fixed;
        z-index: 50;
        left: 50%;
        top: 20%;
        transform: translateX(-50%);
        width: min(22rem, calc(100vw - 24px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgb(0 0 0 / 22%);
        padding: 14px;
        font-size: 13px;
      }

      .translate-settings-title {
        margin: 0;
        font-weight: 600;
      }

      .translate-settings-note,
      .translate-settings-status {
        margin: 6px 0 0;
      }

      .translate-key {
        font: inherit;
        font-size: 13px;
        width: 100%;
        margin: 10px 0 0;
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
      }

      .translate-settings-actions {
        display: flex;
        gap: 8px;
        margin: 12px 0 0;
      }

      .translate-forget[hidden] {
        display: none;
      }

      /* ----------------------------------------------------------- the alarms */

      .alarm-marker {
        font-size: 11px;
        color: var(--warn);
        text-align: center;
      }

      .alarm-popup {
        position: fixed;
        z-index: 40;
        width: min(21rem, calc(100vw - 24px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgb(0 0 0 / 22%);
        padding: 12px 14px;
        font-size: 13px;
      }

      .alarm-popup-title {
        font-weight: 600;
        margin: 0;
      }

      .alarm-popup-when,
      .alarm-note,
      .alarm-status,
      .alarm-denied {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .alarm-denied {
        color: var(--late);
      }

      .alarm-walk {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 0;
        flex-wrap: wrap;
      }

      .alarm-walk-input {
        font: inherit;
        font-size: 13px;
        width: 4rem;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
      }

      .alarm-walk-unit,
      .alarm-walk-label {
        font-size: 12px;
        color: var(--ink-soft);
      }

      .alarm-leads {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0 0;
      }

      .alarm-lead-box {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .alarm-lead-text {
        font-size: 12px;
      }

      .alarm-actions {
        display: flex;
        gap: 8px;
        margin: 12px 0 0;
      }

      .alarm-set,
      .alarm-drop,
      .alarm-close {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 10px;
        font-size: 13px;
      }

      .alarm-set {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      /* ------------------------------------------------------------ narrower */

      @media (max-width: 480px) {
        :root {
          --col-destination-min: 5.5rem;
          --col-minutes: 2.2rem;
          --col-badge: 2.5rem;
          --col-connection: 4rem;
          --col-platform: 1.4rem;
          --col-state: 2rem;
          --col-alarm: 0.9rem;
          --col-stop: 2.3rem;
          /* Wider on a phone than on a desktop, because the interchange column
             is dropped here and the journey is what takes its place. */
          --col-route: 8.6rem;
        }

        #app {
          padding: 0 12px 32px;
        }

        .bar {
          margin: 0 -12px 10px;
          padding-left: 12px;
          padding-right: 12px;
        }

        .row {
          column-gap: 5px;
        }

        .minutes {
          font-size: 18px;
        }

        .destination {
          font-size: 13px;
        }
      }
    </style>
  </head>

    <div id="app"></div>
    <script src="app.js"></script>
  </body>
