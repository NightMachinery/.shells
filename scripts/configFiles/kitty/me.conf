startup_session ${HOME}/scripts/configFiles/kitty/session.kitty

#: Path to a session file to use for all kitty instances. Can be
#: overridden by using the kitty --session command line option for
#: individual instances. See
#: https://sw.kovidgoyal.net/kitty/index.html#sessions in the kitty
#: documentation for details. Note that relative paths are interpreted
#: with respect to the kitty config directory. Environment variables
#: in the path are expanded.

#: --- terminal background, for programs that cannot ask ---
#:
#: Emacs (and vim, and others) cannot query a terminal for its background
#: colour; the sole convention is COLORFGBG, "fg;bg" as colour indices, from
#: rxvt. kitty does not set it, and with it absent Emacs *guesses* -- and it
#: guesses dark. On this light theme (background #fdf6e3, Solarized Light)
#: that made every face render for the wrong polarity: washed out and
#: low-contrast, regardless of which theme was loaded.
#:
#: bg=15 (white) is what marks the background light; Emacs treats 0-6 and 8
#: as dark in `frame-set-background-mode'.
env COLORFGBG=0;15

#: The same value under an LC_ name, purely so it survives ssh: sshd accepts
#: only what its AcceptEnv allows, and the CIS servers allow `LANG LC_*` --
#: so COLORFGBG itself is dropped, while LC_COLORFGBG arrives. The remote
#: shell copies it back (see ~/.night-bootstrap.env).
#: @note Requires `SendEnv LC_COLORFGBG` on the client side too.
env LC_COLORFGBG=0;15
