# Open any image in the full kitty window by clicking on it
protocol file
mime image/*
action launch --type=overlay /usr/local/bin/kitty +kitten icat --hold ${FILE_PATH}


protocol file
# ext org,md,txt,zsh
action launch --type=background /bin/sh -c 'exec "${BRISHZGO_BIN:-$HOME/go/bin/brishzgo}" -- zopen "$@"' brishzgo ${FILE_PATH}

