#: Quick-access kitty, toggled from Hammerspoon with hyper+shift+z
#: (hammerspoon/core/window-media-bindings.lua). A panel window that floats
#: over fullscreen apps, which is the whole reason it exists next to hyper+z.
#: Documented options: `kitten quick-access-terminal --help` and
#: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

#: `center` anchors the panel to all four edges, so it covers the whole display
#: (everything but the menu bar and the dock on macOS).
edge center

#: The kitten defaults to 0.85; we want a normal, opaque terminal.
background_opacity 1.0

#: Toggle explicitly with the hotkey rather than vanishing on every click away.
hide_on_focus_loss no

#: Remote control on its own socket, so scripts can drive this instance without
#: confusing it with the regular kitty (listen_on in kitty.conf).
kitty_override allow_remote_control=socket-only
kitty_override listen_on=unix:${HOME}/.local/state/kitty-quick-access.sock
